name: release

on:
  push:
    tags: ["v*"]

# The default GITHUB_TOKEN is the only credential. It creates a draft release
# with the archives, packages and checksums. The container image is skipped
# until a registry and its login are chosen (see .goreleaser.yaml).
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6.1.0
        with:
          distribution: goreleaser
          version: "~> v2.12"
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
